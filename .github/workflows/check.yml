# Compila el sitio en cada pull request. No despliega nada: solo impide que
# una rama que no compila llegue a main, que es lo unico que se publica.
name: Build check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npx --no-install astro build --site "https://lauramoramicropigmentacion.com" --base "/"
